services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vet
      POSTGRES_DB: vet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sett POSTGRES_PASSWORD i .env.local}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - vet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vet -d vet']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  vet-postgres-data:
